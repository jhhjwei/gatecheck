[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gatecheck"
version = "0.1.0"
description = "发布前预检 + 五态发布锁 + 真实时钟台账，给单人内容运营用的本地门禁"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "gatecheck contributors" }]
keywords = ["content-ops", "publishing", "linter", "duplicate-detection", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Text Processing",
]
dependencies = []

[project.scripts]
gatecheck = "gatecheck.cli:main"

[tool.setuptools]
packages = ["gatecheck"]
